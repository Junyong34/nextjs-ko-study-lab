name: 예제·데모 동작 오류
description: 기본 브랜치 또는 배포 사이트에서 재현되는 예제·데모 오류를 제보합니다.
title: "[버그] "
labels:
  - kind:bug
  - area:nextjs-app
  - phase:2
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        기본 브랜치 또는 식별 가능한 배포 URL에서 확인한 오류를 제보해 주세요. 로컬 WIP·미병합 커밋만의 문제는 이 Form의 대상이 아닐 수 있습니다. 취약점, 토큰, 개인정보는 입력하지 말고 [보안 정책](https://github.com/Junyong34/nextjs-ko-study-lab/security/policy)의 Private Vulnerability Reporting을 이용하세요.
  - type: checkboxes
    id: preflight
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 open·closed 이슈를 검색했으며 같은 문제를 찾지 못했습니다.
          required: true
        - label: 이 내용은 공개 가능한 동작 오류이며 민감한 보안 정보가 포함되지 않았습니다.
          required: true
  - type: input
    id: target
    attributes:
      label: 대상 URL 또는 데모 식별자
      description: 기본 브랜치의 공개 경로 또는 배포된 페이지 URL을 적어 주세요.
      placeholder: URL 또는 데모 이름
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 다른 사람이 같은 결과를 확인할 수 있도록 번호를 붙여 적어 주세요.
      placeholder: |
        1. 페이지를 엽니다.
        2. 다음 동작을 수행합니다.
        3. 오류를 확인합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상이라면 어떤 결과가 나와야 하는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 관찰한 결과와 오류 메시지를 적어 주세요. 비밀값은 제거하세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 브라우저·OS
      description: 브라우저와 OS를 적어 주세요. 모르는 값은 `모름`이라고 적어도 됩니다.
      placeholder: "예: Chrome 140 / macOS 15"
    validations:
      required: true
  - type: input
    id: next-version
    attributes:
      label: 관찰한 Next.js 버전
      description: 확인한 버전을 적어 주세요. 알 수 없으면 `모름`이라고 적어도 됩니다.
      placeholder: "예: 16.3.1 또는 모름"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그·스크린샷
      description: 선택 항목입니다. 토큰·개인정보·내부 URL을 제거한 뒤 첨부하세요.
    validations:
      required: false
